#===== Config file containing samples ==========================================
# This gets appended to config

# Project name to use for naming summary files
PROJ:
    "H66K_CTD_H3K9Me3"
    
SEQ_DATE:
    "241122"

# Directories containing fastq files, this can be a relative path.
# Multiple directories can be provided. The sample names must correspond
# to the begining of the fastq name.
RAW_DATA:
    - "/beevol/home/erickson/fastqs/241122_Novogene"

# Alignment mode and index(es) to use for analysis
# * ALIGNMENT_MODE: single | split 
# * Each INDEXES entry's name must match a ref yaml file present in workflow/ref
# * single mode: normal alignment
# * split mode: one pre-built combined index, aligned once then split post-hoc
#   by contig name into per-genome bams -- INDEX_PATH/INDEX_MAP below point at
#   that combined index (specific to this project, not reusable metadata)
ALIGNMENT_MODE:
    "single"
INDEXES:
  - name: "hg38"

# ALIGNMENT_MODE:
#     "split"
# INDEXES:
#   - name: "hg38"
#     role: "primary"
#   - name: "mm39"
#     role: "spike"
# INDEX_PATH:
#     "/beevol/home/erickson/ref/hg38_mm39/"
# INDEX_MAP:
#     "hg38_mm39"

# GENELISTS: only used by the downstream matrix pipeline (Stranded_matrix.smk /
# UnStranded_matrix.smk / bidirectional_matrix.smk) -- ignored at this
# alignment stage. If not set, matrix files are built for just the primary
# index's own gene list. If set, matrix files are built ONLY for the ref
# yaml(s) listed here (not also the primary's own, unless you list it too).
# Every entry must be a ref yaml name that resolves to the SAME real
# alignment index as the primary INDEXES entry above (see workflow/ref/readme.txt).
# GENELISTS:
#   - hg38
#   - hg38_tRNA

# The sample names must match the beginning of a fastq file in one of the
# directories listed under RAW_DATA. If the sample name
# matches multiple fastqs, an error will be thrown.
# nicknames will be used for bw and matrix/plots names
#
# SAMPLES:
#     SECTION-1:
#         GROUP-1: # subsample norm example
#             sample_nickname-1:
#                  - "fastq_sample_1_prefix"
#             sample_nickname-2:
#                  - "fastq_sample_2_prefix"
# 
#         GROUP-2: 
#             sample_nickname-3:
#                  - "fastq_sample_3_prefix"
#             sample_nickname-4:
#                  - "fastq_sample_4_prefix"
# 
#     SECTION-2:
#         ...
#

SAMPLES:
    SECTION-1:
        PNUTS-CTD:
            PP1-PNUTS-H66K_mdox_CTD: 
                - "H66K_mdox_CTD"
                
            PP1-PNUTS-H66K_pdox_CTD: 
                - "H66K_pdox_CTD"
            
        PNUTS-H3kpme2:
            PP1-PNUTS-H66K_mdox_H3k9me2: 
                - "H66KmdoxH3k9me2"
                
            PP1-PNUTS-H66K_pdox_H3k9me2: 
                - "H66KpdoxH3k9me2"
           
                  
# Norm sample bw and matix files,
# with "RPKM","CPM","BPM","RPGC" 
# Or with scaleFactor from featureCounts file i.e. "chrM" "protein_coding", 
# Group norm bw and matix files
# scaleFactor within a group for bed file or bins, use: "scalefactor"
# subsampling: make bw and matix files from sub-sampled bam files within each group, use: "subsample"
NORM: # more than one can be set at at time
  - "CPM"


  # set RGB colors for bw urls and table files, 
  # list as many colors as samples (not inputs) 
  # applied in order of samples ignoring inputs
COLORS:
  - "0,0,0"       # - Black
  - "225,0,0"     # - Bright red
  - "0,225,0"     # - Bright green
  - "0,0,225"     # - Bright blue
  - "255,127,0"   # - Orange
  - "177,89,40"   # - Brown
  - "106,61,154"  # - Purple
  - "255,55,153"  # - Hot pink/magenta
  - "166,206,22"  # - Lime green/yellow-green
  - "31,120,180"  # - Steel blue
  - "251,154,153" # - Light pink/salmon pink
  - "178,223,138" # - Light green/pale green
  - "51,160,44"   # - Forest green 
  - "227,26,28"   # - Red
  - "253,191,111" # - Light orange/peach
  - "202,178,214" # - Light purple/lavender

# program options 
CMD_PARAMS:
    multimap:       "" # " -k 2 " # all but -k n multi-mapper from will be randomly filtered out.
    samtools:       " -bF4q10 "
    bamCoverage:    " --binSize 10 --skipNonCoveredRegions --centerReads "
    scalingFactors: "" # " BED-file --centerReads " (set SCALING_REF in the ref yaml) or " bins --binSize 100 "
    fragment_size: 
      paired:       " --maxFragmentLength 1000 "
      single:       " bin=10 max=1010 "
    featureCounts:  " --readExtension5 2000 --readExtension3 2000 " #--largestOverlap
    filter_results: "chrM|snRNA|snoRNA|rRNA|protein_coding|scalefactor"
    
# sandbox User #
USER:
  "User7"
  
# set strand orentation of fastq files, can list one for each file         
ORIENTATION:
    "Unstranded"

# single (False) vs paired (True) end mapping, decoupled from ORIENTATION above
PAIRED:
    "True" # set False if single end

# which matrix type(s) to make
# deeptools options set in Stranded_matrix.yaml
# can only to be "543", "5", "5L", "3", or "PI" 
REGIONS:
  - "543"
  - "5"
  - "5L"
  - "3"
  - "PI"


# Save data on amc-sandbox and make URLS
skip_bam_urls: true
skip_bw_urls: false
skip_matrix_url: false

# html report
skip_html_report: true
skip_matrix_html_report: true

####bamCoverage#####
# --binSize INT 
#                   Size of the bins, in bases, for the output of the bigwig/bedgraph file. (Default: 50)
#                   Read coverage normalization options:
# --effectiveGenomeSize EFFECTIVEGENOMESIZE
#                  The effective genome size is the portion of the genome that is mappable. (default: None)
# --normalizeUsing {RPKM,CPM,BPM,RPGC,None}
#                  (Default: None)
# --ignoreForNormalization IGNOREFORNORMALIZATION [IGNOREFORNORMALIZATION ...]
#                  A list of space-delimited chromosome names containing those chromosomes that should be excluded for computing the normalization. 
#                  example: --ignoreForNormalization chrX chrM. (default: None)
# --skipNonCoveredRegions, --skipNAs
#                  This parameter determines if non-covered regions. The default is to treat those regions as having a value of zero. (default: False)
# --smoothLength INT bp
#                  The smooth length defines a window, larger than the binSize, to average the number of reads. 
#                  example: --binSize is set to 20 and the --smoothLength is set to 60, (default: None)
# 
# Read processing options:
#   ---ignoreDuplicates    
#                        reads with same orientation and start will be considered only once. paired: the mate's position considered. (default: False)
#   --minMappingQuality INT
#                         If set, only reads that have a mapping quality score of at least this are considered. (default: None)
#   --centerReads         
#                         Centered with respect to the fragment length.  (default: False)
#   --samFlagInclude INT  
#                         Include reads based on the SAM flag.  (Default: None)
#   --samFlagExclude INT  
#                         Exclude reads based on the SAM flag. (Default: None)
#   --minFragmentLength INT
#                         The minimum fragment length needed for read/pair inclusion. (Default: 0)
#   --maxFragmentLength INT
#                         The maximum fragment length needed for read/pair inclusion. (Default: 0)
