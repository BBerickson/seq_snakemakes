#===== Config file for translational efficiency (TE) analysis =================
# This gets appended to config
#
# Joins a COMPLETED Ribo-seq run (RiboSeq.smk / RiboSeq_UMI.smk) and a
# COMPLETED RNA-seq run (RNAseq.smk) into anota2seq (primary) + xtail
# (secondary) translational-efficiency analysis. Reads each run's existing
# PROJ/counts/{sample}_aligned_{index}_featureCounts.tsv outputs directly --
# no new per-project manifest format, just point at the two PROJ directories.
#
# Run RiboSeq.smk/RiboSeq_UMI.smk and RNAseq.smk to completion FIRST -- this
# pipeline does no alignment/quantification of its own, only the TE join.

PROJ:
    "Example_RiboSeq_TE"

# Completed run directories + the PRIMARY_INDEX each one used (needed to
# construct the exact featureCounts file paths each run already produced).
RIBO_PROJ:
    "/path/to/completed/riboseq/run/ProjName"
RIBO_INDEX:
    "hg38"

RNA_PROJ:
    "/path/to/completed/rnaseq/run/ProjName"
RNA_INDEX:
    "hg38"

# Each completed run's OWN samples.yaml -- needed to translate a shared
# nickname (below) into that run's own fastq-prefix naming, since the two
# runs are never guaranteed to share one (e.g. "ribo_untr_a" vs
# "mrna_untr_a" for the same "untr_a" nickname) and featureCounts files are
# named after the fastq prefix, not the nickname.
RIBO_SAMPLES_YAML:
    "/path/to/completed/riboseq/run/RiboSeq_samples.yaml"
RNA_SAMPLES_YAML:
    "/path/to/completed/rnaseq/run/RNAseq_samples.yaml"

# Each contrast compares two groups of samples, by NICKNAME (e.g. "untr_a",
# not "ribo_untr_a"/"mrna_untr_a") -- nicknames must match EXACTLY between
# the Ribo-seq and RNA-seq runs' own SAMPLES dicts (e.g. both runs must use
# "WT_Rep1"/"KO_Rep1" etc. as their nickname) -- samples are paired by
# nickname, not by position or by fastq-prefix.
#
# CONTRASTS:
#   - name: "KO_vs_WT"
#     group1: ["WT_Rep1", "WT_Rep2"]  # baseline/reference
#     group2: ["KO_Rep1", "KO_Rep2"]  # comparison
#
CONTRASTS:
  - name: "KO_vs_WT"
    group1: ["WT_Rep1", "WT_Rep2"]
    group2: ["KO_Rep1", "KO_Rep2"]

CMD_PARAMS:
    # restrict to one biotype before testing (standard practice for TE --
    # matches results_riboseq.R's own featureCounts biotype column); empty
    # string disables filtering
    filter_biotype: "protein_coding"
    # use RIBO_PROJ's P-site-restricted, CDS-only counts (rules/
    # 03e_riboseq_psite_cds_counts.snake) instead of plain featureCounts for
    # the Ribo-seq side -- requires RIBO_PROJ to have been run with
    # enable_psite_cds_counts: true, otherwise this file won't exist.
    use_psite_counts: false

# GO enrichment on TE-changed genes. clusterProfiler/AnnotationDbi/GO.db are
# genome-agnostic and live in the Ribo-seq container itself -- but the
# species-specific org.*.eg.db annotation package is deliberately kept OUT
# of the container (installed on the server instead, in a shared R library
# directory bind-mounted at runtime) so adding a new genome never requires a
# container rebuild. See ref/hg38_p14/go_annotation/README.txt for how to
# obtain/install one (hg38 already set up there; also covers mouse).
run_go_enrichment: false
GO_ORGANISM_DB: "org.Hs.eg.db"
GO_ANNOTATION_LIB_DIR: "/beevol/home/erickson/ref/hg38_p14/go_annotation"

USER:
  "User7"

skip_html_report: true
