#===== Config file containing samples ==========================================
# This gets appended to config

# Project name to use for naming Directory and summary files
PROJ:
    "Example_RiboSeq"

SEQ_DATE:
    "260101"

# Directories containing fastq files, this can be a relative path.
# Multiple directories can be provided. The sample names must correspond
# to the begining of the fastq name.
RAW_DATA:
    - "/path/to/fastqs"

# Alignment mode and index(es) to use for analysis -- Ribo-seq aligns with
# STAR (ALIGNMENT_MODE: single only; no split/sequential support here).
# Each INDEXES entry's name must match a "<name>_star.yaml" ref yaml present
# in workflow/ref (the same _star ref yaml family star.smk/RNAseq_samples.yaml
# use, e.g. hg38_star.yaml -- see workflow/ref/readme.txt).
ALIGNMENT_MODE:
    "single"
INDEXES:
  - name: "hg38"

# The sample names must match the beginning of a fastq file in one of the
# directories listed under RAW_DATA. If the sample name
# matches multiple fastqs, an error will be thrown.
# nicknames will be used for bw and matrix/plots names
#
# SAMPLES:
#     SECTION-1:
#         GROUP-1:
#             sample_nickname-1:
#                  - "fastq_sample_1_prefix"
#             sample_nickname-2:
#                  - "fastq_sample_2_prefix"
#
#     SECTION-2:
#         ...
#

SAMPLES:
    SECTION-1:
        WT:
            WT_Rep1:
              - "riboseq_WT_rep1"
            WT_Rep2:
              - "riboseq_WT_rep2"

        KO:
            KO_Rep1:
              - "riboseq_KO_rep1"
            KO_Rep2:
              - "riboseq_KO_rep2"

# Differential ribosome occupancy (optional, rules/03f_riboseq_differential_occupancy.snake)
# -- plain DESeq2 on this project's OWN featureCounts (no paired RNA-seq
# needed/used), by SAMPLES nickname (not fastq prefix). This is NOT
# translational efficiency -- without RNA-seq there's no way to tell "more
# ribosomes on this transcript" apart from "more of this transcript exists"
# -- it is differential ribosome FOOTPRINT signal, a real and standard
# thing to report when no paired RNA-seq run exists, with that caveat.
# Leave empty/omit to skip this step entirely.
#
# CONTRASTS:
#   - name: "KO_vs_WT"
#     group1: ["WT_Rep1", "WT_Rep2"]  # baseline/reference
#     group2: ["KO_Rep1", "KO_Rep2"]  # comparison
#
CONTRASTS:
  - name: "KO_vs_WT"
    group1: ["WT_Rep1", "WT_Rep2"]
    group2: ["KO_Rep1", "KO_Rep2"]

# Norm sample bw and matix files
# with "RPKM","CPM","BPM","RPGC"
# Or with scaleFactor from featureCounts file i.e. "chrM"
NORM:
  - "CPM"

# sandbox User #
USER:
  "User7"

CMD_PARAMS:
    # -q 20 -O 1 reproduce Trim Galore's own defaults explicitly (quality
    # cutoff 20, stringency/overlap 1) -- cutadapt's own defaults are
    # different (-q 0 i.e. off, -O 3), so these need to be set here rather
    # than left to cutadapt's own bare defaults. Add -a <adapter_sequence>
    # (or -g for 5' adapters) for your library's actual adapter.
    cutadapt:
      single: " -q 20 -O 1 -m 15 "
    # a fasta file with a phiX/other contaminant reference, or empty to skip
    bbsplit: ""
    sortmerna: " --other -v "
    star: # tuned for short (~28-32nt) Ribo-seq footprints
      single: " --alignEndsType EndToEnd --outFilterMismatchNmax 2 --outFilterMultimapNmax 20 --outSAMattributes NH HI AS NM MD "
    multimap:     ""  # " -k 1 " # all but -k n multi-mapper from will be randomly filtered out.
    samtools:      " -bF4q10 "
    bamCoverage:   " --binSize 1 --skipNonCoveredRegions "
    scalingFactors: "" # " BED-file --centerReads " (set SCALING_REF in the ref yaml) or " bins --binSize 100 "
    fragment_size:
      single:  " bin=1 max=50 " # footprint length distribution (~15-50nt)
    featureCounts: " " #--largestOverlap
    filter_results: "protein_coding|scalefactor"
    # restrict to one biotype before testing (standard practice -- matches
    # results_riboseq.R's own featureCounts biotype column); empty string
    # disables filtering. use_psite_counts reuses enable_psite_cds_counts'
    # stricter P-site/CDS-restricted counts instead of plain featureCounts
    # for the test itself -- requires enable_psite_cds_counts: true above,
    # otherwise that file won't exist.
    differential_occupancy:
      filter_biotype: "protein_coding"
      use_psite_counts: false

# phiX/other contaminant reference fasta for BBSplit (workflow/rules/01c_riboseq_bbsplit.snake),
# or leave empty to skip. Not genome-specific (unlike SORTMERNA_DB/BED12/
# SALMON_INDEX, which live in the ref yaml instead), same convention as BARCODES.
CONTAMINANT_REF:
    ""

# set orentation of fastq files -- single-end, so R1 or R2 only
ORIENTATION:
    "R1" # R1, R2

# single (False) vs paired (True) end mapping -- always False for Ribo-seq
# footprints (single-end after UMI extraction)
PAIRED:
    "False"

# set colors for bw urls and table files, if missing 0,0,0 is default
COLORS:
  - "0,0,0"       # - Black
  - "225,0,0"     # - Bright red
  - "0,225,0"     # - Bright green
  - "0,0,225"     # - Bright blue
  - "255,127,0"   # - Orange
  - "177,89,40"   # - Brown
  - "106,61,154"  # - Purple
  - "255,55,153"  # - Hot pink/magenta
  - "166,206,22"  # - Lime green/yellow-green
  - "31,120,180"  # - Steel blue
  - "251,154,153" # - Light pink/salmon pink
  - "178,223,138" # - Light green/pale green
  - "51,160,44"   # - Forest green
  - "227,26,28"   # - Red
  - "253,191,111" # - Light orange/peach
  - "202,178,214" # - Light purple/lavender


# stop after alignment, used for small single gene genome expression alignment
stop_after_alignment: false

# optional contaminant removal (phiX etc.) -- skip if CONTAMINANT_REF is empty
# anyway, but can be forced off here too
skip_bbsplit: false

# Save data on amc-sandbox and make URLS
skip_bam_urls: true
skip_bw_urls: false

# html report
skip_html_report: true

# P-site-restricted, CDS-only gene counts (rules/03e_riboseq_psite_cds_counts.snake)
# -- a stricter alternative to featureCounts' plain exon-overlap counts for
# downstream TE analysis (RiboSeq_TE.smk's CMD_PARAMS.use_psite_counts).
# Off by default: it's a second full riboWaltz pass (bamtolist/psite_info),
# so doubles that step's cost.
enable_psite_cds_counts: false

## Additional common parameters for various processing steps
### cutadapt ##
# -q INT              Quality cutoff for trimming low-quality 3' ends (20
#                      matches Trim Galore's own default -- see above).
# -O INT               Minimum overlap required to trim an adapter match (1
#                      matches Trim Galore's own default, quite permissive --
#                      bare cutadapt's own default is a more conservative 3).
# -m INT               Discard reads shorter than INT after trimming (lower
#                      this for Ribo-seq footprints, which are ~20-35nt).
# -a STR               3' adapter sequence (no auto-detection, unlike Trim
#                      Galore -- must be set explicitly per library/kit).
# --stringency INT     Overlap with adapter required to trim (default 1, quite
#                      permissive; raise for less aggressive trimming).
# --quality INT        Phred quality threshold for trimming (default 20).
#
### SortMeRNA ##
# --ref FILE[,FILE...] One or more rRNA reference databases (fasta).
# --other              Output non-rRNA (accepted) reads -- required, this is
#                       what feeds alignment.
# -v                   Verbose logging (parsed by rules._sortmerna_summary).
#
### STAR (short-read Ribo-seq tuning) ##
# --alignEndsType EndToEnd          Disable soft-clipping (footprints are
#                                    already precisely trimmed).
# --outFilterMismatchNmax INT       Max mismatches allowed (lower for short
#                                    reads than typical RNA-seq).
# --outFilterMultimapNmax INT       Max loci a read can map to before being
#                                    considered unmapped.
# --quantMode TranscriptomeSAM      Always added by rules/02a_align_star.snake
#                                    (shared with plain RNA-seq's star.smk) --
#                                    do not set here, it's hardcoded.
#
####bamCoverage#####
# --binSize INT
#                   Size of the bins, in bases, for the output of the bigwig/bedgraph file. (Default: 50)
#                   Read coverage normalization options:
# --normalizeUsing {RPKM,CPM,BPM,RPGC,None}
#                  (Default: None)
# --skipNonCoveredRegions, --skipNAs
#                  This parameter determines if non-covered regions. The default is to treat those regions as having a value of zero. (default: False)
